<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Revilend.uz — loyiha kartalari (1200×630)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Open with the dev server: http://localhost:3000/tools/og-cards.html?id=<project-id>
         Screenshot the viewport at 1200x630 as JPEG (quality ~88) into
         public/og/<project-id>.jpg. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05070d;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: Inter, system-ui, sans-serif;
        color: #e2e8f0;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 1200px;
        height: 630px;
        padding: 56px 64px 48px;
        overflow: hidden;
        background:
          radial-gradient(900px 420px at 12% 0%, rgba(0, 242, 254, 0.16), transparent 70%),
          radial-gradient(760px 520px at 96% 92%, var(--glow), transparent 72%),
          linear-gradient(160deg, #0b1220 0%, #05070d 58%, #060a14 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.09) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.09) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 78% 62% at 30% 18%, #000 30%, transparent 100%);
      }

      .rule {
        position: absolute;
        inset-inline: 0;
        top: 0;
        height: 4px;
        background: linear-gradient(90deg, #00f2fe, #38bdf8, var(--accent));
      }

      header,
      footer,
      main {
        position: relative;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(140deg, #00f2fe, #38bdf8, #8b5cf6);
        color: #05070d;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 700;
        box-shadow: 0 10px 30px -10px rgba(0, 242, 254, 0.8);
      }

      .wordmark {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #fff;
      }

      .wordmark span {
        color: #00f2fe;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border: 1px solid var(--accent-border);
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-text);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #7dd3fc;
      }

      .index {
        color: #475569;
      }

      h1 {
        margin: 18px 0 0;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 76px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: #fff;
        max-width: 980px;
      }

      p {
        margin: 20px 0 0;
        max-width: 860px;
        font-size: 22px;
        line-height: 1.45;
        color: #94a3b8;
      }

      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }

      .chip {
        padding: 8px 14px;
        border: 1px solid #1e293b;
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.6);
        color: #cbd5e1;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 22px;
        border-top: 1px solid #16202f;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        color: #64748b;
      }

      .url {
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="rule"></div>
      <div class="grid"></div>

      <header>
        <div class="brand">
          <span class="mark">R</span>
          <span class="wordmark">Revilend<span>.uz</span></span>
        </div>
        <span class="status"><span class="dot"></span><span id="status"></span></span>
      </header>

      <main>
        <div class="eyebrow">
          <span class="index" id="index"></span>
          <span id="tagline"></span>
        </div>
        <h1 id="title"></h1>
        <p id="description"></p>
        <div class="stack" id="stack"></div>
      </main>

      <footer>
        <span class="url" id="url"></span>
        <span>3D · full-stack · automation</span>
      </footer>
    </div>

    <script type="module">
      import { projects } from '../src/data/projects.js';

      // Each category keeps its own tint, so twelve projects read as one family
      // without twelve hand-written palettes drifting apart.
      const THEMES = {
        bot: {
          accent: '#34d399',
          text: '#bbf7d0',
          border: 'rgba(52,211,153,0.3)',
          soft: 'rgba(52,211,153,0.08)',
          glow: 'rgba(52,211,153,0.20)',
        },
        web: {
          accent: '#22d3ee',
          text: '#a5f3fc',
          border: 'rgba(34,211,238,0.3)',
          soft: 'rgba(34,211,238,0.08)',
          glow: 'rgba(34,211,238,0.20)',
        },
        game: {
          accent: '#a78bfa',
          text: '#ddd6fe',
          border: 'rgba(167,139,250,0.3)',
          soft: 'rgba(167,139,250,0.08)',
          glow: 'rgba(139,92,246,0.24)',
        },
      };

      const id = new URLSearchParams(location.search).get('id');
      const project = projects.find((item) => item.id === id) ?? projects[0];
      const theme = THEMES[project.category] ?? THEMES.web;

      const card = document.getElementById('card');
      card.style.setProperty('--accent', theme.accent);
      card.style.setProperty('--accent-text', theme.text);
      card.style.setProperty('--accent-border', theme.border);
      card.style.setProperty('--accent-soft', theme.soft);
      card.style.setProperty('--glow', theme.glow);

      document.getElementById('status').textContent = project.status.label;
      document.getElementById('index').textContent = project.index;
      document.getElementById('tagline').textContent = project.tagline;
      document.getElementById('title').textContent = project.title;
      document.getElementById('description').textContent = project.description;
      document.getElementById('url').textContent = `revilend.uz/loyiha/${project.id}`;
      document.getElementById('stack').innerHTML = project.stack
        .map((item) => `<span class="chip">${item}</span>`)
        .join('');

      document.fonts.ready.then(() => document.body.setAttribute('data-ready', 'true'));
    </script>
  </body>
</html>
